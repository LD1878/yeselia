name: Deploy to GitHub Pages

# Publishes the Next.js static export from out/ with official Pages actions.
# Source stays on main; the export is not committed back onto the branch.
#
# GitHub Pages: Settings → Pages → Source must be "GitHub Actions".
# Keep the custom domain set to yeselia.com (HTTPS). The site is served from
# the domain root with empty basePath so assets stay /_next/...
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Custom domain is served from the site root (not /yeselia project path).
          # Leave BASE_PATH empty so CSS/JS/fonts resolve as /_next/... on yeselia.com.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://yeselia.com
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          # CNAME must remain yeselia.com for the custom domain at the site root.
          if [ -f public/CNAME ]; then
            cp -f public/CNAME out/CNAME
          fi
          # Prevent GitHub Pages from treating _next/ as a Jekyll-ignored folder.
          touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
