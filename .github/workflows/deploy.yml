name: Deploy to GitHub Pages

# Publishes the Next.js static export to the main branch root so
# GitHub Pages (Deploy from branch: main /) serves the real site.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Custom domain is served from the site root (not /yeselia project path).
          # Leave BASE_PATH empty so CSS/JS/fonts resolve as /_next/... on yeselia.com.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://yeselia.com
        run: npm run build

      - name: Publish export to branch root
        run: |
          set -euo pipefail

          # Remove previous published site artefacts (keep source)
          rm -rf _next about buy contact insights properties sell 404 docs
          rm -f index.html index.txt 404.html robots.txt sitemap.xml CNAME

          # Promote the fresh export to the repository root
          # (CNAME comes from public/CNAME via the Next export)
          cp -a out/. .
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "deploy: publish static site for GitHub Pages"
            git push
          fi
